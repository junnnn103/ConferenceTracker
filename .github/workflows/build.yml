name: build

on:
  schedule:
    # 주의: schedule은 "기본 브랜치에 있는" 워크플로만 본다. 이 파일이
    # 기본 브랜치(master)에 없으면 cron은 GitHub 입장에서 존재하지 않는다 -
    # 워크플로 목록에 active로 뜨고 push/workflow_dispatch는 멀쩡히 돌기
    # 때문에 겉으로는 정상으로 보인다. 실제로 이 저장소는 2026-09-09부터
    # 2026-09-21까지 월요일이 두 번 지나도록 한 번도 자동 갱신되지 않았다.
    # Pages는 아무 브랜치에서나 서빙되므로 "브랜치로 사이트가 뜬다"를
    # "cron도 돈다"로 착각하기 쉽다. 둘은 별개다.
    # 확인: gh run list --json event --jq '[.[]|select(.event=="schedule")]'
    #
    # 일요일 21:00 UTC = 월요일 06:00 KST. 주 1회.
    # 마감 D-day는 브라우저가 뷰어의 시계로 계산하므로 매일 빌드할 필요가 없다.
    # 이 실행이 하는 일은 업스트림 두 저장소의 변경을 받아오는 것뿐이다.
    - cron: "0 21 * * 0"
  workflow_dispatch:
  # push마다 돌 필요는 없다. 이 워크플로가 하는 일은 업스트림 데이터를 받아오는
  # 것이라 사이트 코드(docs/, tests/)만 고친 push에서는 할 일이 없고, 실패하면
  # 알림 메일만 쌓인다. 데이터·빌드 로직이 바뀐 push에서만 돈다.
  push:
    branches: [master, main]
    paths:
      - "data/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: pip install -e ".[dev,bootstrap]"

      - name: Python 테스트
        run: python -m pytest -q

      - name: JS 테스트
        run: node --test tests/js/

      # 커밋된 CFP 데이터가 여전히 게이트를 통과하는지 다시 확인한다.
      # 네트워크를 타지 않으므로 비용이 없고, 손으로 편집된 값이
      # 게이트를 우회하는 것을 막는다.
      - name: CFP 데이터 재검증
        run: python -m scripts.validate_scraped

      - name: 빌드
        run: python -m scripts.build

      # 정적 자원 URL에 내용 해시를 붙인다. 없으면 GitHub Pages의 10분 캐시 때문에
      # 배포 후에도 브라우저가 옛 CSS/JS를 계속 쓴다.
      - name: 정적 자원 버전 도장
        run: python scripts/stamp_assets.py

      - name: 변경분 커밋
        run: |
          # generated_at은 매 빌드마다 바뀌므로 이 줄만 다르면 "변경 없음"으로
          # 본다 - 안 그러면 이 워크플로가 매일 실속 없는 커밋을 만들고,
          # 그 커밋이 다른 push와 겹치면 충돌까지 난다(실제로 겪은 일이다).
          # conferences.json은 build.py가 json.dumps(..., indent=2)로 쓰므로
          # generated_at이 한 줄을 통째로 차지한다 - -I 옵션이 정확히 그
          # 줄만 걸러낸다. data/scraped는 generated_at이 없으므로 그대로
          # --quiet로 본다.
          if git diff --quiet -I'"generated_at"' -- docs/data/conferences.json \
              && git diff --quiet -- data/scraped docs/index.html docs/app.js; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/conferences.json
          # 도장 단계가 index.html/app.js의 ?v= 값을 바꿨을 수 있다.
          git add docs/index.html docs/app.js
          # data/scraped는 마지막 태스크 전까지 저장소에 존재하지 않는다.
          # 없는 경로를 add하면 git이 실패하므로 있을 때만 추가한다.
          if [ -d data/scraped ]; then
            git add data/scraped
          fi
          git commit -m "학회 일정 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
